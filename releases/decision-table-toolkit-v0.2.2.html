          commit({ ...next, rules: [] });
        } else {
          if (table.rules.length && !confirm(`\u6761\u4EF6\u300C${c.name}\u300D\u3068\u305D\u306E\u5024\u306E\u5B9A\u7FA9\u3092\u524A\u9664\u3057\u307E\u3059\u304B\uFF1F\u898F\u5247\u306F\u4FDD\u6301\u3057\u3001\u3053\u306E\u6761\u4EF6\u306E\u6761\u4EF6\u6307\u5B9A\u3060\u3051\u3092\u5916\u3057\u307E\u3059\u3002`)) return;
          applyDefinitions(next, () => {
          });
        }
      }, "tiny"));
      defs.append(chip);
    }
    for (const o of table.outputs) {
      const chip = element("div", "", "definition-chip output-chip");
      chip.append(button(`${o.name} \xB7 ${o.kind === "action" ? "\u5236\u9650\u6307\u5B9A" : `\u62E1\u5F35\u6307\u5B9A ${o.type}`}`, () => outputDialog(o)), button("\xD7", () => {
        if (!confirm(`\u52D5\u4F5C\u300C${o.name}\u300D\u3068\u5165\u529B\u6E08\u307F\u306E\u52D5\u4F5C\u6307\u5B9A\u3092\u524A\u9664\u3057\u307E\u3059\u304B\uFF1F`)) return;

      wrap.append(blank);

          commit(next);

        up.disabled = index === 0;
        up.title = "\u898F\u5247\u3092\u4E0A\u3078";
        const down = button("\u2193", () => {
          if (index >= table.rules.length - 1) return;
          const next = clone(table);
          [next.rules[index + 1], next.rules[index]] = [next.rules[index], next.rules[index + 1]];

        down.title = "\u898F\u5247\u3092\u4E0B\u3078";
