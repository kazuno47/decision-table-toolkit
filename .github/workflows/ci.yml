# Checks every pull request and every push to main. Nothing here deploys or needs secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The released HTML is exactly what the sources build
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cmp dist/decision-table-toolkit.html "releases/decision-table-toolkit-v${version}.html"
